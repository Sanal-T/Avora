<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>Avora ERP</title>
  <script>
    try {
      const saved = localStorage.getItem('avora-theme')
      if (saved === 'light') {
        document.documentElement.classList.remove('dark')
      } else {
        // Default to dark theme if not explicitly set to light
        document.documentElement.classList.add('dark')
      }
    } catch (e) { }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
